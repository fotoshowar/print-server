<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="https://fotoshow.online/static/favicon.ico"/>
  <title>FotoShow Print — Imprimí tus fotos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    :root {
      --fs-green: #ADFF2F;
      --fs-green-dark: #7CFC00;
      --fs-bg: #0a0a0a;
      --fs-bg-card: #111;
      --fs-border: rgba(173,255,47,0.14);
      --fs-text: #e2e8f0;
      --fs-text-muted: rgba(226,232,240,0.55);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--fs-bg);
      color: var(--fs-text);
      min-height: 100vh;
    }

    /* ── Navbar ── */
    .navbar {
      background: var(--fs-bg);
      border-bottom: 1px solid var(--fs-border);
      padding: 0.75rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 900;
      font-size: 1.25rem;
      color: white !important;
      text-decoration: none;
    }

    .navbar-brand img { height: 32px; }

    /* ── Hero ── */
    .hero {
      background:
        radial-gradient(ellipse 70% 60% at 20% 10%, rgba(173,255,47,0.08) 0%, transparent 55%),
        var(--fs-bg);
      color: white;
      padding: 3rem 1.25rem 2.5rem;
      border-bottom: 1px solid var(--fs-border);
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(1.9rem, 5vw, 3.2rem);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    .hero h1 em { color: var(--fs-green); font-style: normal; }

    .hero p {
      color: var(--fs-text-muted);
      font-size: 1.05rem;
      line-height: 1.7;
      max-width: 560px;
      margin: 0 auto 2rem;
    }

    /* ── Galerías ── */
    .galleries-section {
      padding: 3rem 1.25rem;
      background: var(--fs-bg);
    }

    .galleries-header {
      margin-bottom: 2rem;
    }

    .galleries-header h2 {
      font-size: 1.4rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
    }

    .galleries-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    @media (max-width: 768px) {
      .galleries-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }

    /* ── Gallery Card ── */
    .gallery-card {
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
      background: var(--fs-bg-card);
      border: 1px solid rgba(255,255,255,0.07);
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .gallery-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
      border-color: var(--fs-border);
      color: inherit;
    }

    .gallery-cover {
      aspect-ratio: 16/9;
      background: #1a1a1a;
      overflow: hidden;
      position: relative;
    }

    .gallery-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .gallery-card:hover .gallery-cover img { transform: scale(1.05); }

    .gallery-price {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(173,255,47,0.15);
      color: var(--fs-green);
      border: 1px solid rgba(173,255,47,0.3);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
    }

    .gallery-body {
      padding: 0.85rem 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .gallery-name {
      font-weight: 700;
      margin-bottom: 0.2rem;
      line-height: 1.3;
      font-size: 0.95rem;
      color: #e2e8f0;
    }

    .gallery-meta {
      font-size: 0.75rem;
      color: var(--fs-text-muted);
      margin-top: auto;
    }

    /* ── Loading ── */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4rem 1.25rem;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(173,255,47,0.3);
      border-top-color: var(--fs-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 4rem 1.25rem;
      color: var(--fs-text-muted);
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
  </style>
</head>
<body>

<!-- ── Navbar ── -->
<nav class="navbar">
  <div class="container-fluid px-3 d-flex align-items-center justify-content-between">
    <a class="navbar-brand" href="/">
      <img src="https://fotoshow.online/static/logo.png" alt="FotoShow"/>
      <span>Foto<span style="color: var(--fs-green)">Show</span> Print</span>
    </a>
  </div>
</nav>

<!-- ── Login View ── -->
<section id="login-view" class="hero">
  <div class="container" style="max-width:720px">
    <h1>Imprimí tus <em>fotos</em> al instante</h1>
    <p>Seleccioná galerías, elige tus fotos favoritas e imprimí en alta calidad con EPSON L805</p>
    <button class="btn btn-lg" onclick="loginWithGoogle()" style="background: var(--fs-green); color: #000; font-weight: 700; margin-top: 2rem; padding: 0.75rem 2rem;">
      <i class="bi bi-google me-2"></i>Entrar con Google
    </button>
  </div>
</section>

<!-- ── Galleries View (after login) ── -->
<section id="galleries-view" style="display: none;">

<!-- ── Galerías ── -->
  <div class="galleries-section">
    <div class="container">
      <div class="galleries-header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <h2>📸 Galerías disponibles</h2>
            <p style="color: var(--fs-text-muted);">Seleccioná una galería para ver las fotos</p>
          </div>
          <button onclick="logout()" style="background: rgba(255,50,50,0.15); color: #ff6b6b; border: 1px solid rgba(255,50,50,0.3); padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; cursor: pointer;">
            Salir
          </button>
        </div>
      </div>

      <!-- Loading state -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
      </div>

      <!-- Empty state -->
      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="icon">📭</div>
        <p>No hay galerías disponibles</p>
      </div>

      <!-- Grid de galerías -->
      <div id="galleries-grid" class="galleries-grid" style="display: none;"></div>
    </div>
  </div>
</section>

<script>
  let authToken = localStorage.getItem('authToken');

  // Inicializar
  document.addEventListener('DOMContentLoaded', () => {
    if (authToken) {
      showGalleries();
      loadGalleries();
    } else {
      showLogin();
    }
  });

  function showLogin() {
    document.getElementById('login-view').style.display = 'block';
    document.getElementById('galleries-view').style.display = 'none';
  }

  function showGalleries() {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('galleries-view').style.display = 'block';
  }

  function loginWithGoogle() {
    // Redirigir a fotoshow.online para autenticarse
    window.location.href = 'https://fotoshow.online/api/auth/google?redirect=' + encodeURIComponent(window.location.href);
  }

  function logout() {
    localStorage.removeItem('authToken');
    authToken = null;
    showLogin();
  }

  async function loadGalleries() {
    try {
      const response = await fetch('/api/galleries', {
        headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
      });
      if (!response.ok) throw new Error('Error cargando galerías');

      const galleries = await response.json();
      displayGalleries(galleries);
    } catch (error) {
      console.error('Error:', error);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('empty-state').style.display = 'block';
    }
  }

  function displayGalleries(galleries) {
    const grid = document.getElementById('galleries-grid');
    const loading = document.getElementById('loading');
    const empty = document.getElementById('empty-state');

    loading.style.display = 'none';

    if (!galleries || galleries.length === 0) {
      empty.style.display = 'block';
      return;
    }

    grid.style.display = 'grid';

    grid.innerHTML = galleries.map(gallery => `
      <a href="/gallery.html?id=${gallery.id}" class="gallery-card">
        <div class="gallery-cover">
          ${gallery.cover_photo_url ? `<img src="${gallery.cover_photo_url}" alt="${gallery.name}" loading="lazy">` : '<div style="background:#1a1a1a;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--fs-text-muted)">📷</div>'}
          ${gallery.price_per_photo ? `<div class="gallery-price">$${(gallery.price_per_photo/100).toLocaleString('es-AR')}</div>` : ''}
        </div>
        <div class="gallery-body">
          <h3 class="gallery-name">${gallery.name}</h3>
          <div class="gallery-meta">
            📷 ${gallery.photo_count} fotos
            ${gallery.location ? `• ${gallery.location}` : ''}
            ${gallery.event_date ? `• ${new Date(gallery.event_date).toLocaleDateString('es-AR')}` : ''}
          </div>
        </div>
      </a>
    `).join('');
  }

  // Procesar callback de Google si viene en URL
  const params = new URLSearchParams(window.location.search);
  if (params.has('token')) {
    authToken = params.get('token');
    localStorage.setItem('authToken', authToken);
    window.history.replaceState({}, document.title, window.location.pathname);
    location.reload();
  }
</script>

</body>
</html>
